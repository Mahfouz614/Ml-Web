<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenithAcademy Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        navy: {
                            950: '#070c1e',
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                        },
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* CSS Animations & Microinteractions */
        @keyframes pageSlideIn {
            0% { transform: translateY(8px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .animate-page {
            animation: pageSlideIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Active click press micro-interaction */
        .click-active {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s ease;
        }
        .click-active:active {
            transform: scale(0.95) !important;
        }

        /* Coordinates click ripple effect */
        .ripple-btn {
            position: relative;
            overflow: hidden;
        }
        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0);
            animation: ripple-anim 0.45s linear;
            pointer-events: none;
        }
        @keyframes ripple-anim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.5);
        }
    </style>
</head>

    <script>
        // GLOBAL PERSISTENT STATE
        let currentUser = {
            name: "",
            email: "",
            role: "student", // "student" or "teacher"
            dept: "Computer Science & IT",
            initials: "--"
        };

        let selectedQuarterFilter = "Quarter 1";
        let activeView = "dashboard";

        // MASTER GRADES DATA (Editable by Teacher, Read-Only for Student)
        let masterGradesData = [
            { id: 1, name: 'World History A', assignments: 16, grade: 'A', percentage: 97.3, teacher: 'Mr. Davis' },
            { id: 2, name: 'Early College IT Fundamentals', assignments: 7, grade: 'A', percentage: 91.2, teacher: 'Dr. Robert Vance' },
            { id: 3, name: 'Early College Programming', assignments: 7, grade: 'A', percentage: 93.1, teacher: 'Dr. Robert Vance' },
            { id: 4, name: 'Biology C', assignments: 16, grade: 'B', percentage: 80.0, teacher: 'Mrs. Gable' },
            { id: 5, name: 'English II C', assignments: 1, grade: 'A', percentage: 95.0, teacher: 'Ms. Thornton' },
            { id: 6, name: 'Geometry C', assignments: 11, grade: 'A', percentage: 90.0, teacher: 'Mr. Henderson' }
        ];

        // SETUP & EVENT LISTENERS
        window.addEventListener('DOMContentLoaded', () => {
            setupRippleClickEffects();
            // Default preset in login form
            fillPreset('Mouhamadou Ly', 'mly4583@zenithacademy.org', 'student');
        });

        // Click Ripple & Touch Microinteractions
        function setupRippleClickEffects() {
            document.addEventListener('click', function (e) {
                const target = e.target.closest('.click-active, .ripple-btn, button, a');
                if (!target) return;

                const circle = document.createElement('span');
                const diameter = Math.max(target.clientWidth, target.clientHeight);
                const radius = diameter / 2;

                const rect = target.getBoundingClientRect();
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${e.clientX - rect.left - radius}px`;
                circle.style.top = `${e.clientY - rect.top - radius}px`;
                circle.classList.add('ripple-effect');

                const ripple = target.getElementsByClassName('ripple-effect')[0];
                if (ripple) ripple.remove();

                target.appendChild(circle);
            });
        }

        // Helper: Dynamic Initials Calculation
        function calculateInitials(fullName) {
            if (!fullName) return "ZA";
            const parts = fullName.trim().split(' ').filter(Boolean);
            if (parts.length === 0) return "ZA";
            if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
            return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

                <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200/80 dark:border-slate-700">

                            </div>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Logged in as <strong>${currentUser.name}</strong> — Edits live-sync directly to student accounts.</p>

                        <button onclick="addNewCourseModal()" class="ripple-btn click-active px-4 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold shadow-md flex items-center gap-2">

                                    </div>

                                    <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-400 uppercase">Assignments</label>
                                            <input type="number" id="edit-assignments-${cls.id}" value="${cls.assignments}" class="w-20 px-2 py-1 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-xs font-bold">
                                        </div>
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-400 uppercase">Percentage (%)</label>
                                            <input type="number" step="0.1" id="edit-pct-${cls.id}" value="${cls.percentage}" class="w-24 px-2 py-1 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-xs font-bold">
                                        </div>
                                        <div>
                                            <label class="block text-[10px] font-bold text-slate-400 uppercase">Letter</label>
                                            <select id="edit-letter-${cls.id}" class="px-2 py-1 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-xs font-bold">
                                                <option value="A" ${cls.grade === 'A' ? 'selected' : ''}>A</option>
                                                <option value="B" ${cls.grade === 'B' ? 'selected' : ''}>B</option>
                                                <option value="C" ${cls.grade === 'C' ? 'selected' : ''}>C</option>
                                                <option value="D" ${cls.grade === 'D' ? 'selected' : ''}>D</option>
                                                <option value="F" ${cls.grade === 'F' ? 'selected' : ''}>F</option>

                                        </div>
                                        <div class="pt-3 md:pt-0 flex gap-2">
                                            <button onclick="saveCourseGradeChanges(${cls.id})" class="ripple-btn click-active px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold shadow-md flex items-center gap-1">

                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // 4. NOTIFICATIONS MODULE
        function renderNotificationsView(container) {
            container.innerHTML = `
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200/80 dark:border-slate-700 max-w-3xl mx-auto">
                    <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100 dark:border-slate-700">
                        <h1 class="text-xl font-black text-slate-900 dark:text-white">Notifications</h1>
                        <button onclick="showToast('All notifications marked as read', 'success')" class="ripple-btn click-active text-xs font-bold text-brand-600 dark:text-brand-400 hover:underline">Mark all read</button>
                    </div>
                    <div class="space-y-3">
                        <div class="p-4 rounded-xl bg-blue-50/60 dark:bg-slate-700/40 border border-blue-200 dark:border-slate-600 flex gap-3">

                                <h4 class="text-xs font-bold text-slate-900 dark:text-white">Quarter 1 Report Cards Released</h4>
                                <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">Your official academic report card for Quarter 1 is ready for viewing.</p>
                                <span class="text-[10px] text-slate-400 mt-2 block">10 minutes ago</span>
                            </div>
                        </div>
                        <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-700/20 border border-slate-200 dark:border-slate-700 flex gap-3">
                            <div class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs font-bold"><i class="fa-solid fa-star"></i></div>
                            <div>
                                <h4 class="text-xs font-bold text-slate-900 dark:text-white">Merit Award Received</h4>
                                <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">Dr. Vance awarded 10 positive behavior points for excellence in IT lab.</p>
                                <span class="text-[10px] text-slate-400 mt-2 block">Yesterday</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 5. CLASSES MODULE
        function renderClassesView(container) {
            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    ${masterGradesData.map(c => `
                        <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700 hover:border-brand-500 transition-all">
                            <div class="flex justify-between items-start mb-3">
                                <span class="text-[10px] font-black uppercase px-2 py-0.5 bg-brand-50 text-brand-600 dark:bg-slate-700 dark:text-brand-300 rounded">Active Class</span>
                                <span class="text-xs font-extrabold text-emerald-600">${c.percentage}% (${c.grade})</span>
                            </div>
                            <h3 class="text-sm font-black text-slate-900 dark:text-white mb-1">${c.name}</h3>
                            <p class="text-xs text-slate-400">Instructor: ${c.teacher}</p>
                            <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-700/60 flex justify-between items-center text-xs">
                                <span class="text-slate-400">${c.assignments} Assignments</span>
                                <button onclick="showToast('Syllabus opened', 'info')" class="text-brand-600 font-bold hover:underline">Syllabus →</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // 6. ATTENDANCE MODULE
        function renderAttendanceView(container) {
            container.innerHTML = `
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200/80 dark:border-slate-700 max-w-2xl mx-auto text-center">
                    <h1 class="text-xl font-black text-slate-900 dark:text-white mb-2">Attendance Summary</h1>
                    <p class="text-xs text-slate-400 mb-6">Attendance record for ${currentUser.name}</p>
                    <div class="grid grid-cols-3 gap-4">
                        <div class="p-4 bg-emerald-50 dark:bg-emerald-950/40 rounded-2xl border border-emerald-200 dark:border-emerald-800">
                            <span class="text-2xl font-black text-emerald-600">98.5%</span>
                            <span class="block text-xs font-bold text-slate-500 mt-1">Present</span>
                        </div>
                        <div class="p-4 bg-amber-50 dark:bg-amber-950/40 rounded-2xl border border-amber-200 dark:border-amber-800">
                            <span class="text-2xl font-black text-amber-600">1</span>
                            <span class="block text-xs font-bold text-slate-500 mt-1">Tardy</span>
                        </div>
                        <div class="p-4 bg-blue-50 dark:bg-blue-950/40 rounded-2xl border border-blue-200 dark:border-blue-800">
                            <span class="text-2xl font-black text-brand-600">0</span>
                            <span class="block text-xs font-bold text-slate-500 mt-1">Unexcused</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // 7. BEHAVIOR LOGS MODULE
        function renderBehaviorView(container) {
            container.innerHTML = `
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200/80 dark:border-slate-700 max-w-2xl mx-auto">
                    <div class="flex justify-between items-center mb-6">
                        <h1 class="text-xl font-black text-slate-900 dark:text-white">Positive Behavior Merits</h1>
                        <span class="bg-amber-100 text-amber-800 text-xs font-black px-3 py-1 rounded-full"><i class="fa-solid fa-star text-amber-500 mr-1"></i> 145 Points</span>
                    </div>
                    <div class="space-y-3">
                        <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-700/30 border border-slate-200 dark:border-slate-700 flex justify-between items-center">
                            <div>
                                <h4 class="text-xs font-bold text-slate-900 dark:text-white">Peer Leadership Recognition</h4>
                                <p class="text-[11px] text-slate-400">Awarded by Dr. Robert Vance</p>
                            </div>
                            <span class="text-sm font-black text-emerald-600">+15 PTS</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // GENERIC MODULE PLACEHOLDER
        function renderGenericModuleView(viewName, container) {
            container.innerHTML = `
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-12 text-center shadow-sm border border-slate-200/80 dark:border-slate-700 max-w-xl mx-auto my-12 animate-page">
                    <div class="w-16 h-16 bg-brand-50 text-brand-600 rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold mb-4">
                        <i class="fa-solid fa-folder-open"></i>
                    </div>
                    <h2 class="text-xl font-black text-slate-900 dark:text-white capitalize">${viewName}</h2>
                    <p class="text-slate-500 dark:text-slate-400 text-xs mt-2">Official academic record synchronized for ${currentUser.name}.</p>
                    <button onclick="navigateView('dashboard')" class="ripple-btn click-active mt-6 px-5 py-2.5 bg-brand-600 text-white text-xs font-extrabold rounded-xl shadow-md">
                        Return to Dashboard
                    </button>
                </div>
            `;
        }

        // EDIT TEACHER GRADES
        function saveCourseGradeChanges(id) {
            const course = masterGradesData.find(c => c.id === id);
            if (!course) return;

            const newAssign = parseInt(document.getElementById(`edit-assignments-${id}`).value);
            const newPct = parseFloat(document.getElementById(`edit-pct-${id}`).value);
            const newLetter = document.getElementById(`edit-letter-${id}`).value;

            if (!isNaN(newAssign)) course.assignments = newAssign;
            if (!isNaN(newPct)) course.percentage = newPct;
            course.grade = newLetter;

            showToast(`Updated ${course.name} grade as ${newPct}% (${newLetter})`, 'success');
        }

        function addNewCourseModal() {
            const courseName = prompt("Enter Course Name:");
            if (!courseName) return;
            masterGradesData.push({
                id: masterGradesData.length + 1,
                name: courseName,
                assignments: 5,
                grade: 'A',
                percentage: 95.0,
                teacher: currentUser.name
            });
            navigateView('teacher-grading');
            showToast(`Added course: ${courseName}`, 'success');
        }

        // PROFILE EDIT MODAL
        function openProfileEditModal() {
            document.getElementById('modal-name-input').value = currentUser.name;
            document.getElementById('modal-email-input').value = currentUser.email;
            const modal = document.getElementById('profile-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeProfileEditModal() {
            const modal = document.getElementById('profile-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function saveProfileChanges(e) {
            e.preventDefault();
            currentUser.name = document.getElementById('modal-name-input').value.trim();
            currentUser.email = document.getElementById('modal-email-input').value.trim();
            updateProfileUI();
            closeProfileEditModal();
            navigateView(activeView);
            showToast('Profile updated!', 'success');
        }

        // THEME CONTROLLER
        function setTheme(mode) {
            if (mode === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-light-btn').className = "ripple-btn click-active px-2.5 py-1 text-xs font-bold rounded-lg transition-all text-slate-400";
                document.getElementById('theme-dark-btn').className = "ripple-btn click-active px-2.5 py-1 text-xs font-bold rounded-lg transition-all text-brand-400 bg-slate-700 shadow-sm";
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-light-btn').className = "ripple-btn click-active px-2.5 py-1 text-xs font-bold rounded-lg transition-all text-amber-500 bg-white shadow-sm";
                document.getElementById('theme-dark-btn').className = "ripple-btn click-active px-2.5 py-1 text-xs font-bold rounded-lg transition-all text-slate-400";
            }
        }

        function switchQuarterTab(q) {
            selectedQuarterFilter = q;
            showToast(`Filtered for ${q}`, 'info');
            if (activeView === 'grades') renderGradesView(document.getElementById('main-content'));
        }

        function showHelpToast() {
            showToast("Need assistance? Contact support@zenithacademy.org", "info");
        }

        // TOAST NOTIFICATIONS
        function showToast(msg, type = 'success') {
            const stack = document.getElementById('toast-stack');
            const toast = document.createElement('div');
            
            const styles = {
                success: 'bg-emerald-600 text-white',
                info: 'bg-navy-900 text-white',
                error: 'bg-red-600 text-white'
            };

            toast.className = `${styles[type] || styles.success} px-4 py-3 rounded-xl shadow-xl flex items-center gap-2.5 text-xs font-bold animate-page pointer-events-auto border border-white/20`;
            toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>${msg}</span>`;
            
            stack.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(8px)';
                toast.style.transition = 'all 0.2s ease';
                setTimeout(() => toast.remove(), 200);
            }, 2500);
        }
    </script>
</body>
</html>
